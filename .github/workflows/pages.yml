name: Publish EduCheck to GitHub Pages

on:
  push:
    branches:
      - main
      - agents/mn-sn-bilan-maktab-uchun-dastur-yaratiwimiz-kera
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
